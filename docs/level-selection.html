<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/index.css">
    <script src="./scripts/scene-manager.js" defer></script>
    <script type="module" src="./scripts/level-selection.js"></script>
    <title>The Film Box – Filmrol kiezen</title>
</head>
<body class="room-page">
    <header class="room-header">
        <button onclick="switchScene('index.html')">Terug naar start</button>
        <h1>Kies een filmrol</h1>
    </header>

    <main class="room-stage" aria-label="Woonkamer met zes filmrollen">
        <img class="room-background" src="./assets/rooms/living-room.png" alt="Woonkamer">
        <button class="film-roll roll-1" data-level="intention-01" aria-label="Open filmrol 1"><img src="./assets/rooms/film-roll.png" alt=""></button>
        <button class="film-roll roll-2" data-level="intention-01" aria-label="Open filmrol 2"><img src="./assets/rooms/film-roll.png" alt=""></button>
        <button class="film-roll roll-3" data-level="intention-01" aria-label="Open filmrol 3"><img src="./assets/rooms/film-roll.png" alt=""></button>
        <button class="film-roll roll-4" data-level="intention-01" aria-label="Open filmrol 4"><img src="./assets/rooms/film-roll.png" alt=""></button>
        <button class="film-roll roll-5" data-level="intention-01" aria-label="Open filmrol 5"><img src="./assets/rooms/film-roll.png" alt=""></button>
        <button class="film-roll roll-6" data-level="intention-01" aria-label="Open filmrol 6"><img src="./assets/rooms/film-roll.png" alt=""></button>

        <div class="film-box" aria-label="Doos voor voltooide filmrollen">
            <div class="film-box-back"></div>
            <div id="storedRolls" class="stored-rolls"></div>
            <div class="film-box-front"></div>
            <div class="film-box-label">FILMS</div>
        </div>
    </main>

    <div id="levelModal" class="level-modal" aria-hidden="true">
        <div class="level-backdrop"></div>
        <section id="levelWindow" class="level-window phase-video" role="dialog" aria-modal="true" aria-label="Filmfragment bekijken en verhaal afmaken">
            <div id="videoStage" class="video-stage" aria-label="Bekijk het filmfragment">
                <div class="film-holes film-holes-top" aria-hidden="true"></div>
                <div class="video-frame">
                    <video id="levelVideo" playsinline preload="auto" aria-label="Filmfragment van het verhaal"></video>
                    <div id="videoCountdown" class="video-countdown" aria-live="assertive"></div>
                    <div id="videoMessage" class="video-message" role="status"></div>
                </div>
                <div class="film-holes film-holes-bottom" aria-hidden="true"></div>
            </div>
            <div id="keyframeStrip" class="film-strip" aria-label="Drie belangrijke momenten uit de film">
                <div class="film-holes film-holes-top" aria-hidden="true"></div>
                <div class="keyframe-row"></div>
                <div class="film-holes film-holes-bottom" aria-hidden="true"></div>
            </div>
            <div id="reflectionStage" class="reflection-stage" aria-label="Vertel wat er volgens u gaat gebeuren">
                <h2>Kunt u omschrijven wat u denkt dat er nu gaat gebeuren?</h2>
                <div class="reflection-bottom">
                    <div class="reflection-microphone">
                        <button id="microphoneButton" class="microphone-button" type="button" aria-label="Start geluidsopname" title="Klik om een geluidsopname te starten of stoppen">🎙</button>
                        <div><span id="recordingWave" class="recording-wave" aria-hidden="true">▂▅▃▇▂▆▃▅</span>
                        <p id="microphoneStatus" role="status">Klik op de microfoon om uw antwoord op te nemen.</p></div>
                    </div>
                    <div class="reflection-next">
                        <span id="reflectionCountdown" class="reflection-countdown" aria-live="polite"></span>
                        <button id="continueToLevel" class="submit-button" type="button" disabled>Verder</button>
                    </div>
                </div>
            </div>
            <div id="configurationStage" class="configuration-stage">
                <h2 class="level-title">Maak het verhaal af</h2>
                <div class="ending-workspace">
                    <div class="scene-panel"><div id="levelScene" class="level-scene" aria-label="Configureer het einde van het verhaal"></div></div>
                    <aside class="control-panel" aria-label="Verander de voorwerpen">
                        <div id="levelControls" class="level-controls"></div>
                        <div class="submit-area">
                            <span id="levelStatus" class="level-status" aria-live="polite"></span>
                            <button id="submitAnswer" class="submit-button" type="button" disabled>Bevestigen</button>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </div>

    <pre id="debugOutput" class="visually-hidden" aria-hidden="true"></pre>
</body>
</html>
