<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/room.css">
    <link rel="stylesheet" href="./styles/level-popup.css">
    <link rel="stylesheet" href="./styles/film-puzzle.css">
    <script src="./runtime-config.js"></script>
    <script type="module" src="./scripts/ui-settings.js"></script>
    <script src="./scripts/scene-manager.js" defer></script>
    <script src="./scripts/audio.js" defer></script>
    <script type="module" src="./scripts/ui-settings.js"></script>
    <script type="module" src="./scripts/tutorial.js"></script>
    <title></title>

</head>
<body class="standard-page home-page" data-i18n-document-title="meta.homeTitle">
    
    <main class="home-content">
    <audio id="voice-over-1">
        <source src="./assets/sounds/cat_dropped_box.mp3">
        Your browser does not support the audio element.
    </audio>
        <audio id="voice-over-2">
        <source src="./assets/sounds/repair_and_clean.mp3">
        Your browser does not support the audio element.
    </audio>
        <audio id="voice-over-3">
        <source src="./assets/sounds/start_couch.mp3">
        Your browser does not support the audio element.
    </audio>
        <p id="tutorial-intro-1" class="tutorial-text" data-i18n="tutorial.intro1"></p>
        <button id = "next-button" class="primary-button" type="button" data-icon="&rarr;" data-i18n="tutorial.continue" data-i18n-aria-label="tutorial.continue"></button>

    </main>
</body>
</html>
