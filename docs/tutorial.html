<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/room.css">
    <link rel="stylesheet" href="./styles/level-popup.css">
    <link rel="stylesheet" href="./styles/film-puzzle.css">
    <script src="./runtime-config.js"></script>
    <script type="module" src="./scripts/ui-settings.js"></script>
    <script src="./scripts/scene-manager.js" defer></script>
    <script src="./scripts/audio.js" defer></script>
    <script type="module" src="./scripts/tutorial.js"></script>
    <title></title>

</head>
<body class="standard-page home-page" data-i18n-document-title="meta.tutorialTitle">
    
    <main class="story-video-screen">

            <video id="tutorial-video" playsinline preload="metadata" data-i18n-aria-label="tutorial.videoAria">
                <source src="./assets/sounds/cat_box_beginning.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
            <button id="tutorial-video-start" class="primary-button video-start-button" type="button" data-icon="▶" data-i18n="video.start" data-i18n-aria-label="video.start"></button>
        <audio id="voice-over-1">
            <source src="./assets/sounds/voice_over/ne/tutorial_intro_1.mp3">
            Your browser does not support the audio element.
        </audio>
        <audio id="voice-over-2">
            <source src="./assets/sounds/voice_over/ne/tutorial_intro_2.mp3">
            Your browser does not support the audio element.
        </audio>
        <audio id="voice-over-3">
            <source src="./assets/sounds/voice_over/ne/tutorial_intro_3.mp3">
            Your browser does not support the audio element.
        </audio>
                <audio id="voice-over-4">
            <source src="./assets/sounds/voice_over/ne/tutorial_intro_4.mp3">
            Your browser does not support the audio element.
        </audio>

        <section class="tutorial-card" hidden>
            <p id="tutorial-intro-1" class="tutorial-text" data-i18n="tutorial.intro1"></p>
            <button id="next-button" class="primary-button" type="button" data-icon="→" data-i18n="tutorial.continue" data-i18n-aria-label="tutorial.continue" disabled></button>
        </section>

    </main>
</body>
</html>
