<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/room.css">
    <link rel="stylesheet" href="./styles/level-popup.css">
    <link rel="stylesheet" href="./styles/administrator.css">
    

    <script src="./runtime-config.js"></script>
    <script type="module" src="./scripts/administrator_score.js"></script>
    <script type="module" src="./scripts/administrator_data.js"></script>
    <script src="./scripts/audio.js"></script>
    <script type="module" src="./scripts/ui-settings.js"></script>
    <script src="./scripts/scene-manager.js" defer></script>
    <script src="./scripts/administrator.js" defer></script>

    <title>Administrator View</title>
</head>

<body class="standard-page"> 

    <div class="admin-container">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="room-header">
            <button
                class="secondary-button"
                type="button"
                onclick="switchScene('index.html')"
                data-icon="←"
                data-i18n="common.backHome"
                data-i18n-aria-label="common.backHome">
            </button>
        
            <h1 data-i18n="administrator.view" data-i18n-aria-label="administrator.view">Administrator view</h1>
        </header>


        <!-- =========================
             SIDEBAR
        ========================== -->
        <aside class="sidebar">

            <button
                class="secondary-button sidebar-button active"
                onclick="showSection('score', this)" data-i18n="administrator.score" data-icon="▤">
                Score
            </button>

            <button
                class="secondary-button sidebar-button"
                onclick="showSection('audio', this)"
                data-icon="♫" data-i18n="administrator.audio"
                data-i18n-aria-label="administrator.audio">
                Audio
            </button>

            <button
                class="secondary-button sidebar-button"
                onclick="showSection('data', this)"
                data-icon="✎" data-i18n="administrator.data"
                data-i18n-aria-label="administrator.data">
                Insert data
            </button>
            <button class="secondary-button sidebar-button"
                onclick="showSection('download', this)" data-i18n="administrator.download" data-icon="↓">
                Download
            </button>

        </aside>


        <!-- =========================
             MAIN CONTENT
        ========================== -->
        <main class="admin-content">


            <section id="score" class="admin-section active-section">

                <h2 class="section-title">Score</h2>

                <!-- Search for Participant -->
                 <div class="participant-search-bar">
                    <input
                        type="text"
                        id="scoreParticipantInput"
                        data-i18n-placeholder="administrator.ScorePlaceholder"
                    >
                    <button type="button" class="primary-button" id="searchParticipantBtn" data-icon="⌕" data-i18n="administrator.LoadScore" data-i18n-aria-label="administrator.LoadScore">
                        Load Score Data
                    </button>
                    <button type="button" class="primary-button" id="downloadParticipant" data-icon="↓" data-i18n="administrator.downloadPdf">
                        Download PDF
                    </button>
                </div>
            
                <p class="input-error" id="scoreSearchError"></p>
                
                <!-- Participant information + total score -->
                <div class="score-summary">
            
                    <div class="participant-info" id="participantInfo">
                        <!-- Generated by administrator.js -->
                    </div>
            
                    <div class="total-score" id="totalScore">
                        <!-- Generated by administrator.js -->
                    </div>
            
                </div>
            
                <!-- Tutorial / Affective / Cognitive / Emotion -->
                <div class="score-categories" id="scoreCategories">
                    <!-- Generated by administrator.js -->
                </div>

                
            
            </section>



            <!-- =====================
                 AUDIO
            ====================== -->
            <section id="audio" class="admin-section">


                <!-- VIDEO AUDIO -->

                <div class="audio-setting">

                    <div class="setting-header">

                        <h2>Audio Video's</h2>

                        <label class="switch">

                            <input type="checkbox" id="videoAudioToggle">

                            <span class="slider"></span>

                        </label>

                    </div>


                </div>



                <!-- BUTTON AUDIO -->

                <div class="audio-setting">

                    <div class="setting-header">

                        <h2>Audio Knoppen</h2>

                        <label class="switch">

                            <input type="checkbox" id="buttonAudioToggle" >

                            <span class="slider"></span>

                        </label>

                    </div>


                </div>

            </section>



            <section id="data" class="admin-section">

                <h2 class="section-title" data-i18n="administrator.edit" data-i18n-aria-label="administrator.edit">Edit participant data</h2>
            
                <div class="data-form">
            
                    <!-- Participant number -->
                    <div class="form-group">
                        <label for="participantNumber" data-i18n="administrator.participantNumber" data-i18n-aria-label="administrator.participantNumber">
                            Participant number
                        </label>
                    
                        <input
                            type="text"
                            inputmode="numeric"
                            id="participantNumber"
                            name="participantNumber"
                            data-i18n-placeholder="administrator.participantNumber"
                        >
                    
                        <p class="input-error" id="participantNumberError"></p>
                    </div>
            
            
                    <!-- Age -->
                    <div class="form-group">
                        <label for="participantAge" data-i18n="administrator.age" data-i18n-aria-label="administrator.age">
                            Age
                        </label>
                    
                        <input
                            type="text"
                            inputmode="numeric"
                            id="participantAge"
                            name="participantAge"
                            data-i18n-placeholder="administrator.age"
                        >
                    
                        <p class="input-error" id="participantAgeError"></p>
                    </div>
            
            
                    <!-- Gender -->
                    <div class="form-group">
            
                        <label data-i18n="administrator.gender" data-i18n-aria-label="administrator.gender">Gender</label>
            
                        <div class="gender-selector">
            
                            <input
                                type="radio"
                                id="genderMale"
                                name="participantGender"
                                value="male"
                            >
                            <label for="genderMale" data-i18n="administrator.male" data-i18n-aria-label="administrator.male">
                                Male
                            </label>
            
            
                            <input
                                type="radio"
                                id="genderFemale"
                                name="participantGender"
                                value="female"
                            >
                            <label for="genderFemale" data-i18n="administrator.female" data-i18n-aria-label="administrator.female">
                                Female
                            </label>
            
            
                            <input
                                type="radio"
                                id="genderNvt"
                                name="participantGender"
                                value="nvt"
                            >
                            <label for="genderNvt" data-i18n="administrator.na" data-i18n-aria-label="administrator.na">
                                NVT
                            </label>
            
                        </div>
            
                    </div>
            
            
                    <!-- Education level -->
                    <div class="form-group">
            
                        <label for="educationLevel" data-i18n="administrator.education" data-i18n-aria-label="administrator.education">
                            Education level
                        </label>
            
                        <select id="educationLevel" name="educationLevel">
                            <option value="">Select education level</option>
                        </select>
                    </div>
            
            
                    <!-- Save -->
                    <button
                        type="button"
                        
                        class="primary-button "
                        id="saveParticipantData" data-icon="✓"
                        data-i18n="administrator.save"
                        data-i18n-aria-label="administrator.save"
                    >
                        Save
                    </button>
            
                    <p
                        class="save-message"
                        id="saveMessage"
                    ></p>
            
                </div>
            
            </section>

        <!-- =====================
                 DOWNLOAD
        ====================== -->
        <section id="download" class="admin-section">
            <h2 class="section-title">Download</h2>
        
            <button class="primary-button" id="downloadCsvBtn" data-icon="↓" data-i18n="administrator.downloadCsv">
                Download CSV
            </button>
        </section>

        </main>

    </div>
</body>
</html>
