<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/room.css">
    <link rel="stylesheet" href="./styles/level-popup.css">
    <link rel="stylesheet" href="./styles/administrator.css">
    <script src="./runtime-config.js"></script>
    <script type="module" src="./scripts/admin-page-guard.js"></script>
    <script type="module" src="./scripts/administrator_score.js"></script>
    <script type="module" src="./scripts/administrator_data.js"></script>
    <script src="./scripts/audio.js"></script>
    <script type="module" src="./scripts/ui-settings.js"></script>
    <script src="./scripts/scene-manager.js" defer></script>
    <script src="./scripts/administrator.js" defer></script>
    <title>Beheerder overzicht</title>
</head>
<body class="standard-page">
    <div class="admin-container" hidden>
        <header class="room-header">
            <button class="secondary-button compact-button" type="button" id="adminBackBtn" data-icon="←" data-i18n-aria-label="common.backHome"></button>
        </header>
        <aside class="sidebar">
            <button class="secondary-button sidebar-button active" onclick="showSection('score', this)" data-icon="▤" data-i18n="administrator.participants">Deelnemers</button>
            <button class="secondary-button sidebar-button" onclick="showSection('audio', this)" data-icon="⚙︎" data-i18n="administrator.settings" data-i18n-aria-label="administrator.settings">Instellingen</button>
        </aside>
        <main class="admin-content">
            <section id="score" class="admin-section active-section">
                <div id="participantsListView">
                    <h2 class="section-title" data-i18n="administrator.participants">Deelnemers</h2>
                    <div class="participant-toolbar">
                        <div class="participant-search-bar">
                            <input type="search" id="scoreParticipantInput" data-i18n-placeholder="administrator.searchPlaceholder" data-i18n-aria-label="administrator.searchPlaceholder" aria-label="Deelnemers zoeken">
                            <button type="button" class="primary-button" id="searchParticipantBtn" data-icon="⌕" data-i18n="administrator.search">Zoeken</button>
                        </div>
                        <button type="button" class="secondary-button" id="downloadAllCsvBtn" data-icon="↓" data-i18n="administrator.downloadAllCsv">CSV van alle deelnemers downloaden</button>
                    </div>
                    <p class="input-error" id="scoreSearchError" role="alert"></p>
                    <div class="participants-table-wrap">
                        <table class="participants-table">
                            <thead>
                                <tr>
                                    <th scope="col" data-i18n="administrator.participantNumber">Deelnemernummer</th>
                                    <th scope="col" data-i18n="administrator.status">Status</th>
                                    <th scope="col" data-i18n="administrator.answeredQuestions">Beantwoorde vragen</th>
                                </tr>
                            </thead>
                            <tbody id="participantsList"></tbody>
                        </table>
                    </div>
                </div>
                <div id="participantResult" hidden>
                    <button type="button" class="secondary-button compact-button back-to-participants" id="backToParticipantsBtn" data-icon="←" data-i18n="administrator.backToAll">Terug naar alle deelnemers</button>
                    <p class="input-error" id="participantDetailError" role="alert"></p>
                    <div class="participant-action-bar">
                        <button type="button" class="primary-button" id="downloadParticipant" data-icon="↓" data-i18n="administrator.downloadPdf">PDF downloaden</button>
                        <button type="button" class="primary-button" id="downloadCsvBtn" data-icon="↓" data-i18n="administrator.downloadParticipantCsv">CSV van deze deelnemer downloaden</button>
                        <button type="button" class="secondary-button" id="editParticipantBtn" data-icon="✎" data-i18n="administrator.editDetails">Gegevens aanpassen</button>
                        <button type="button" class="secondary-button danger-button" id="deleteParticipantBtn" data-icon="✕" data-i18n="administrator.deleteParticipant">Deelnemer verwijderen</button>
                    </div>
                    <div class="score-summary">
                        <div class="participant-info" id="participantInfo"></div>
                        <div class="total-score" id="totalScore"></div>
                    </div>
                    <p id="sessionFolder" class="session-folder"></p>
                    <div class="score-categories" id="scoreCategories"></div>
                </div>
            </section>
            <section id="audio" class="admin-section">
                <div class="audio-setting">
                    <div class="setting-header">
                        <h2 data-i18n="administrator.videoAudio">Videogeluid</h2>
                        <label class="switch">
                            <input type="checkbox" id="videoAudioToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="audio-setting">
                    <div class="setting-header">
                        <h2 data-i18n="administrator.buttonAudio">Knopgeluid</h2>
                        <label class="switch">
                            <input type="checkbox" id="buttonAudioToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                  <!-- Selection shape -->
                  <div class="audio-setting">
                    <div class="setting-header">
                        <h2 data-i18n="administrator.filmBorderStyle">Filmselectierand</h2>

                        <select id="film-border-style">
                            <option value="polygon" data-i18n="administrator.filmBorderPolygon">Diagonaal</option>
                            <option value="rectangle" data-i18n="administrator.filmBorderRectangle">Rechthoek</option>
                        </select>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <dialog id="editParticipantDialog" class="edit-participant-dialog" aria-labelledby="editParticipantTitle">
        <form id="editParticipantForm" class="data-form" novalidate>
            <h2 id="editParticipantTitle" data-i18n="administrator.edit">Deelnemergegevens aanpassen</h2>
            <div class="form-group">
                <label for="participantNumber" data-i18n="administrator.participantNumber">Deelnemernummer</label>
                <input type="text" inputmode="numeric" id="participantNumber" readonly>
                <p class="input-error" id="participantNumberError"></p>
            </div>
            <div class="form-group">
                <label for="participantAge" data-i18n="administrator.age">Leeftijd</label>
                <input type="text" inputmode="numeric" id="participantAge">
                <p class="input-error" id="participantAgeError"></p>
            </div>
            <div class="form-group">
                <label data-i18n="administrator.gender">Geslacht</label>
                <div class="gender-selector" id="genderSelector">
                    <input type="radio" id="genderMale" name="participantGender" value="male"><label for="genderMale" data-i18n="administrator.male">Man</label>
                    <input type="radio" id="genderFemale" name="participantGender" value="female"><label for="genderFemale" data-i18n="administrator.female">Vrouw</label>
                    <input type="radio" id="genderNvt" name="participantGender" value="nvt"><label for="genderNvt" data-i18n="administrator.na">NVT</label>
                </div>
                <p class="input-error" id="participantGenderError"></p>
            </div>
            <div class="form-group">
                <label for="educationLevel" data-i18n="administrator.education">Opleidingsniveau</label>
                <select id="educationLevel" name="educationLevel"><option value="" data-i18n="administrator.selectEducation">Selecteer opleidingsniveau</option></select>
                <p class="input-error" id="educationLevelError"></p>
            </div>
            <p id="saveMessage" class="save-message" role="alert"></p>
            <div class="admin-dialog-actions">
                <button type="button" class="secondary-button" id="cancelParticipantEdit" data-i18n="administrator.cancel">Annuleren</button>
                <button type="submit" class="primary-button" id="saveParticipantData" data-icon="✓" data-i18n="administrator.save">Opslaan</button>
            </div>
        </form>
    </dialog>
</body>
</html>
