<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/room.css">
    <link rel="stylesheet" href="./styles/level-popup.css">
    <link rel="stylesheet" href="./styles/administrator.css">
    

    <script src="./runtime-config.js"></script>
    <script type="module" src="./scripts/administrator_score.js"></script>
    <script type="module" src="./scripts/administrator_data.js"></script>
    <script src="./scripts/audio.js"></script>
    <script type="module" src="./scripts/ui-settings.js"></script>
    <script src="./scripts/scene-manager.js" defer></script>

    <title>Administrator View</title>
</head>

<body class="standard-page"> 

    <div class="admin-container">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="room-header">
            <button
                class="secondary-button"
                type="button"
                onclick="switchScene('index.html')"
                data-icon="←"
                data-i18n="common.backHome"
                data-i18n-aria-label="common.backHome">
            </button>
        
            <h1>Administrator view</h1>
        </header>


        <!-- =========================
             SIDEBAR
        ========================== -->
        <aside class="sidebar">

            <button
                class="sidebar-button active"
                onclick="showSection('score', this)">
                Score
            </button>

            <button
                class="sidebar-button"
                onclick="showSection('audio', this)">
                Audio
            </button>

            <button
                class="sidebar-button"
                onclick="showSection('data', this)">
                Insert data
            </button>
            <button class="sidebar-button"
                onclick="showSection('download', this)">
                Download
            </button>

        </aside>


        <!-- =========================
             MAIN CONTENT
        ========================== -->
        <main class="admin-content">


            <section id="score" class="admin-section active-section">

                <h2 class="section-title">Score</h2>

                <!-- Search for Participant -->
                 <div class="participant-search-bar" style="margin-bottom: 1.5rem; display: flex; gap: 0.5rem; align-items: center;">
                    <input
                        type="text"
                        id="scoreParticipantInput"
                        placeholder="Enter Participant Number"
                        style="padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #ccc; max-width: 300px;"
                    >
                    <button type="button" class="primary-button" id="searchParticipantBtn">
                        Load Score Data
                    </button>
                    <button type="button" class="primary-button" id="searchParticipantBtn">
                        Download PDF
                    </button>
                </div>
            
                <p class="input-error" id="scoreSearchError" style="color: red; margin-bottom: 1rem;"></p>
                
                <!-- Participant information + total score -->
                <div class="score-summary">
            
                    <div class="participant-info" id="participantInfo">
                        <!-- Generated by administrator.js -->
                    </div>
            
                    <div class="total-score" id="totalScore">
                        <!-- Generated by administrator.js -->
                    </div>
            
                </div>
            
                <!-- Tutorial / Affective / Cognitive / Emotion -->
                <div class="score-categories" id="scoreCategories">
                    <!-- Generated by administrator.js -->
                </div>

                
            
            </section>



            <!-- =====================
                 AUDIO
            ====================== -->
            <section id="audio" class="admin-section">


                <!-- VIDEO AUDIO -->

                <div class="audio-setting">

                    <div class="setting-header">

                        <h2>Audio Video's</h2>

                        <label class="switch">

                            <input type="checkbox" id="videoAudioToggle">

                            <span class="slider"></span>

                        </label>

                    </div>


                </div>



                <!-- BUTTON AUDIO -->

                <div class="audio-setting">

                    <div class="setting-header">

                        <h2>Audio Knoppen</h2>

                        <label class="switch">

                            <input type="checkbox" id="buttonAudioToggle" >

                            <span class="slider"></span>

                        </label>

                    </div>


                </div>

            </section>



            <section id="data" class="admin-section">

                <h2 class="section-title">Edit participant data</h2>
            
                <div class="data-form">
            
                    <!-- Participant number -->
                    <div class="form-group">
                        <label for="participantNumber">
                            Participant number
                        </label>
                    
                        <input
                            type="text"
                            inputmode="numeric"
                            id="participantNumber"
                            name="participantNumber"
                            placeholder="Participant number"
                        >
                    
                        <p class="input-error" id="participantNumberError"></p>
                    </div>
            
            
                    <!-- Age -->
                    <div class="form-group">
                        <label for="participantAge">
                            Age
                        </label>
                    
                        <input
                            type="text"
                            inputmode="numeric"
                            id="participantAge"
                            name="participantAge"
                            placeholder="Age"
                        >
                    
                        <p class="input-error" id="participantAgeError"></p>
                    </div>
            
            
                    <!-- Gender -->
                    <div class="form-group">
            
                        <label>Gender</label>
            
                        <div class="gender-selector">
            
                            <input
                                type="radio"
                                id="genderMale"
                                name="participantGender"
                                value="male"
                            >
                            <label for="genderMale">
                                Male
                            </label>
            
            
                            <input
                                type="radio"
                                id="genderFemale"
                                name="participantGender"
                                value="female"
                            >
                            <label for="genderFemale">
                                Female
                            </label>
            
            
                            <input
                                type="radio"
                                id="genderNvt"
                                name="participantGender"
                                value="nvt"
                            >
                            <label for="genderNvt">
                                NVT
                            </label>
            
                        </div>
            
                    </div>
            
            
                    <!-- Education level -->
                    <div class="form-group">
            
                        <label for="educationLevel">
                            Education level
                        </label>
            
                        <select
                            id="educationLevel"
                            name="educationLevel"
                        >
                            <option value="">
                                Select education level
                            </option>
            
                            <!-- TODO:
                                REPLACE THESE WITH YOUR
                                ACTUAL EDUCATION LEVELS
                            -->
            
                            <option value="level1">
                                Education level 1
                            </option>
            
                            <option value="level2">
                                Education level 2
                            </option>
            
                            <option value="level3">
                                Education level 3
                            </option>
            
                        </select>
            
                    </div>
            
            
                    <!-- Save -->
                    <button
                        type="button"
                        
                        class="primary-button "
                        id="saveParticipantData"
                    >
                        Save
                    </button>
            
                    <p
                        class="save-message"
                        id="saveMessage"
                    ></p>
            
                </div>
            
            </section>

        <!-- =====================
                 DOWNLOAD
        ====================== -->
        <section id="download" class="admin-section">
            <h2 class="section-title">Download</h2>
        
            <button class="primary-button" id="downloadExcelBtn">
                Download Excel
            </button>
        </section>

        </main>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function showSection(sectionId, clickedButton) {

            // Get all content sections
            const sections =
                document.querySelectorAll(".admin-section");



            // Hide all sections
            sections.forEach(section => {
                section.classList.remove("active-section");
            });


            // Show the selected section
            document
                .getElementById(sectionId)
                .classList.add("active-section");


            // Get all sidebar buttons
            const buttons =
                document.querySelectorAll(".sidebar-button");


            // Remove highlight from all buttons
            buttons.forEach(button => {
                button.classList.remove("active");
            });


            // Highlight clicked button
            clickedButton.classList.add("active");

        }

    </script>

</body>
</html>
